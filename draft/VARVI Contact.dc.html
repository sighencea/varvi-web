<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VARVI | Contact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F2EFE7;color:#161716;font-family:'Cormorant Garamond',serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none;transition:color .4s ease}
a:hover{color:#A98A50}
</style>
</helmet>

<header style="position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(242,239,231,.92);backdrop-filter:blur(8px)">
  <div style="max-width:1440px;margin:0 auto;padding:24px clamp(24px,5vw,80px);display:flex;align-items:center;justify-content:space-between;gap:24px">
    <a href="VARVI Home.dc.html" style="font-size:21px;letter-spacing:.34em;font-weight:500">VARVI</a>
    <a href="VARVI Home.dc.html" style="font-family:Manrope,sans-serif;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;font-weight:500;color:#8E7447">← {{ t.back }}</a>
  </div>
</header>

<main style="min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:140px 24px 100px">
  <img src="./assets/crest-logo.png" alt="VARVI heraldic crest" style="width:170px;mix-blend-mode:multiply">
  <div style="font-family:Manrope,sans-serif;font-size:10.5px;letter-spacing:.4em;text-transform:uppercase;color:#8E7447;font-weight:600;margin-top:40px">{{ t.eyebrow }}</div>
  <h1 style="font-size:clamp(42px,5.6vw,84px);font-weight:500;margin:22px 0 0;line-height:1.1">{{ t.title }}</h1>
  <p style="font-size:clamp(19px,1.6vw,23px);line-height:1.7;color:#4a463e;max-width:52ch;margin:36px 0 0">{{ t.copy }}</p>
  <a href="{{ mailHref }}" style="display:inline-block;font-size:clamp(28px,3.4vw,44px);font-weight:500;letter-spacing:.04em;margin-top:48px;border-bottom:1px solid #B7B0A4;padding-bottom:8px">{{ emailDisplay }}</a>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:clamp(32px,5vw,72px);margin-top:clamp(64px,8vw,110px);max-width:760px;width:100%">
    <div>
      <div style="font-family:Manrope,sans-serif;font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:#8E7447;font-weight:600">{{ t.phoneLabel }}</div>
      <a href="{{ telHref }}" style="display:inline-block;font-size:24px;margin-top:14px">{{ phoneDisplay }}</a>
    </div>
    <div>
      <div style="font-family:Manrope,sans-serif;font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:#8E7447;font-weight:600">{{ t.addressLabel }}</div>
      <div style="font-size:21px;line-height:1.7;margin-top:14px">Casa de vinuri Maria<br>Cricău · Alba · România</div>
    </div>
  </div>
  <div style="font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:#B7B0A4;margin-top:64px">{{ t.note }}</div>
</main>

<footer style="border-top:1px solid #ddd6c8;padding:30px 24px;text-align:center;font-family:Manrope,sans-serif;font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:#B7B0A4">© VARVI / Casa de vinuri Maria</footer>
</x-dc>
<script type="text/x-dc" data-dc-script>
const I18N = {
  en: {
    back: 'Back to the site', eyebrow: 'Contact', title: 'Order by email',
    copy: 'Write to us with the wines you would like and we will reply to confirm availability, pricing and delivery, personally arranged by the wine house.',
    phoneLabel: 'Telephone', addressLabel: 'Wine house',
    note: '[ email address and telephone number to be supplied, placeholders shown ]',
    mailSubject: 'Wine order, VARVI',
    mailBody: 'Hello,\n\nI would like to order the following VARVI wines:\n\n- Wine and quantity:\n\nName:\nDelivery address:\nTelephone:\n\nThank you.',
  },
  ro: {
    back: 'Înapoi la site', eyebrow: 'Contact', title: 'Comandă prin email',
    copy: 'Scrieți-ne ce vinuri doriți și vă răspundem pentru a confirma disponibilitatea, prețul și livrarea, aranjate personal de casa de vinuri.',
    phoneLabel: 'Telefon', addressLabel: 'Casa de vinuri',
    note: '[ adresa de email și numărul de telefon urmează, sunt afișați substituenți ]',
    mailSubject: 'Comandă de vin, VARVI',
    mailBody: 'Bună ziua,\n\nAș dori să comand următoarele vinuri VARVI:\n\n- Vinul și cantitatea:\n\nNume:\nAdresa de livrare:\nTelefon:\n\nVă mulțumesc.',
  },
};

class Component extends DCLogic {
  state = { lang: 'ro' };
  componentDidMount() {
    try {
      const l = localStorage.getItem('varvi_lang');
      if (l === 'ro' || l === 'en') { this.setState({ lang: l }); document.documentElement.lang = l; }
    } catch (e) {}
  }
  renderVals() {
    const t = I18N[this.state.lang] || I18N.ro;
    // ---- CONTACT DETAILS (single source of truth; set real values when supplied) ----
    const EMAIL = ''; // e.g. 'comenzi@...'; empty = placeholder shown, link stays inert
    const PHONE = ''; // keep in sync with the home page
    return {
      t,
      emailDisplay: EMAIL || '··· @ ···',
      mailHref: EMAIL ? 'mailto:' + EMAIL + '?subject=' + encodeURIComponent(t.mailSubject) + '&body=' + encodeURIComponent(t.mailBody) : undefined,
      phoneDisplay: PHONE || '+40 ··· ··· ···',
      telHref: PHONE ? 'tel:' + PHONE.replace(/\s/g, '') : undefined,
    };
  }
}
</script>
</body>
</html>
